<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>多面手 MCP</title>
<!--
  Input: 桥的 HTTP 状态端点（http://127.0.0.1:27731/status）+ 用户点击
  Output: 任务面板（桥状态 / 队列 / 工具组 / 操作目标 / 最近改动 / 快捷动作）
  Pos: WPS 加载项任务窗格页面。一旦我被修改，请更新我的头部注释，以及所属文件夹的md。

  为什么是独立 HTML 而不是 ribbon 按钮弹 alert：
  -----------------------------------------
  设计稿（多面手MCP_加载项UI_v2）画的就是一个常驻任务面板：状态区 + 操作目标锁定 +
  最近改动 + 快捷动作。alert 只能显示一屏静态文本，做不到这些，也做不到自动刷新。
  WPS JS 加载项支持 wps.CreateTaskPane(url, title)，见 main.js 的 ribbonPanel。

  数据来源：任务窗格跑在内嵌浏览器里，连不到命名管道（内核对象，仅限本进程）。
  所以桥额外开了一个只读的 localhost HTTP 端点（默认 127.0.0.1:27731），
  本页面每 2 秒轮询一次。安全边界见 src/bridge/index.ts 的 startHttpEndpoint。

  关于「最近改动」：由桥在管道上记录每个请求的摘要而来（不记文档正文，
  摘要截断到 24 字），所以不需要 MCP server 额外上报。
-->
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2329;
    --text-dim: #8a9099;
    --accent: #3370ff;
    --ok: #17b978;
    --warn: #f58a3c;
    --err: #e34d59;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 12px;
  }
  h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
  h2.on .dot { background: var(--ok); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; margin-bottom: 10px;
  }
  .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .row .k { color: var(--text-dim); }
  .row .v { font-variant-numeric: tabular-nums; }
  .row .v.ok { color: var(--ok); }
  .row .v.warn { color: var(--warn); }
  .row .v.err { color: var(--err); }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button {
    font: inherit; padding: 5px 10px; border: 1px solid var(--border);
    background: #fff; color: var(--text); border-radius: 6px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  .target {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
    padding: 8px; background: #f2f6ff; border: 1px solid #d6e2ff; border-radius: 6px;
  }
  .target .name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .target .lock { font-size: 11px; color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 1px 5px; }
  .target.none { background: #fafafa; border-color: var(--border); color: var(--text-dim); }
  .log { max-height: 180px; overflow-y: auto; }
  .log .item { display: flex; gap: 8px; padding: 3px 0; font-size: 12px; align-items: baseline; }
  .log .t { color: var(--text-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .log .a { font-weight: 500; flex-shrink: 0; }
  .log .s { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .item.fail .a { color: var(--err); }
  .log .empty { color: var(--text-dim); font-size: 12px; padding: 8px 0; }
  .hint { color: var(--text-dim); font-size: 11px; margin-top: 6px; }
  .foot { color: var(--text-dim); font-size: 11px; text-align: center; padding: 6px 0 2px; }
</style>
</head>
<body>

<h2 id="hdr"><span class="dot"></span>多面手 MCP</h2>

<!-- 桥这一层 -->
<div class="card">
  <div class="row"><span class="k">桥进程</span><span class="v" id="v-bridge">—</span></div>
  <div class="row"><span class="k">当前应用</span><span class="v" id="v-app">—</span></div>
  <div class="row"><span class="k">队列</span><span class="v" id="v-queue">—</span></div>
  <div class="row"><span class="k">工具组</span><span class="v" id="v-group">—</span></div>
  <div class="hint" id="v-err"></div>
</div>

<!-- 操作目标锁定 -->
<div class="card">
  <div style="font-weight:600;margin-bottom:2px">操作目标</div>
  <div class="target none" id="target">
    <span class="name" id="target-name">未锁定（跟随活动文档）</span>
    <span class="lock" id="target-lock" style="display:none">锁定</span>
  </div>
  <div class="hint">锁定后，后续所有该应用的操作都指向这个文档，不会因为切换窗口而漂移。</div>
</div>

<!-- 快捷动作 -->
<div class="card">
  <div style="font-weight:600;margin-bottom:2px">快捷动作</div>
  <div class="bar">
    <button onclick="act('save')">保存</button>
    <button onclick="act('undo')">撤销</button>
    <button class="primary" onclick="act('panel')">刷新面板</button>
  </div>
  <div class="hint">更多能力（修订/表格/样式/交叉引用/索引/页码）用 MCP 工具调用，默认列 40 个基础工具。</div>
</div>

<!-- 最近改动 -->
<div class="card">
  <div style="font-weight:600;margin-bottom:6px">最近改动</div>
  <div class="log" id="log"><div class="empty">暂无记录</div></div>
</div>

<div class="foot">wps-office-mcp v2.0.0 · 赢容 · 基于 wps-skills（钱七 &amp; 老王团队）</div>

<script>
var ENDPOINT = 'http://127.0.0.1:' + (window.__PORT__ || 27731) + '/status';

function fmtUptime(ms) {
  var s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  var m = Math.floor(s / 60);
  s = s % 60;
  if (m < 60) return m + 'm' + s + 's';
  var h = Math.floor(m / 60);
  m = m % 60;
  return h + 'h' + m + 'm';
}

function fmtTime(t) {
  var d = new Date(t);
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

var lastData = null;

function render(d) {
  lastData = d;
  var hdr = document.getElementById('hdr');
  hdr.className = (d.uptimeMs > 0) ? 'on' : '';

  document.getElementById('v-bridge').innerHTML = d.uptimeMs > 0
    ? '<span class="ok">已连接 · ' + fmtUptime(d.uptimeMs) + '</span>'
    : '<span class="err">未连接</span>';
  document.getElementById('v-bridge').className = 'v';

  var running = d.appsRunning || [];
  document.getElementById('v-app').textContent = running.length
    ? running.join(' / ') + '（' + running.length + ' 路）'
    : '未附着（用到时自动起）';

  var q = document.getElementById('v-queue');
  q.textContent = (d.queued || 0) + ' / ' + d.queueMax;
  q.className = 'v' + ((d.queued || 0) >= d.queueMax ? ' err' : ((d.queued || 0) > 0 ? ' warn' : ' ok'));

  // 工具组数：从桥侧拿不到（那是 MCP server 的注册表），用固定说明
  document.getElementById('v-group').textContent = '基础 40（共 270，按需加载）';

  // 最近改动
  var log = document.getElementById('log');
  var recent = d.recent || [];
  if (!recent.length) {
    log.innerHTML = '<div class="empty">暂无记录</div>';
  } else {
    log.innerHTML = recent.map(function (e) {
      return '<div class="item' + (e.ok ? '' : ' fail') + '">' +
        '<span class="t">' + fmtTime(e.t) + '</span>' +
        '<span class="a">' + escapeHtml(e.action) + '</span>' +
        '<span class="s">' + escapeHtml(e.summary) + '</span>' +
        '</div>';
    }).join('');
  }

  // 操作目标：从最近一次带 documentName/workbookName 的请求推断
  var target = null;
  for (var i = recent.length - 1; i >= 0; i--) {
    var m = /@(.+)$/.exec(recent[i].summary || '');
    if (m) { target = m[1]; break; }
  }
  var box = document.getElementById('target');
  var nm = document.getElementById('target-name');
  var lk = document.getElementById('target-lock');
  if (target) {
    box.className = 'target';
    nm.textContent = target;
    lk.style.display = '';
  } else {
    box.className = 'target none';
    nm.textContent = '未锁定（跟随活动文档）';
    lk.style.display = 'none';
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function poll() {
  fetch(ENDPOINT).then(function (r) { return r.json(); }).then(render).catch(function () {
    document.getElementById('hdr').className = '';
    document.getElementById('v-bridge').innerHTML = '<span class="err">连不上桥（HTTP 端点）</span>';
    document.getElementById('v-err').textContent =
      '若桥在跑，检查端口是否被占用（WPS_BRIDGE_HTTP_PORT，默认 27731）。';
  });
}

// 快捷动作：任务窗格里只能调 WPS 自己的 JS API，MCP 动作要通过 ribbon 按钮。
// 这里做"能在此环境做的"，其余明确指向 MCP 工具，不假装能做。
function act(what) {
  try {
    if (what === 'save') {
      if (window.Application && Application.ActiveDocument) { Application.ActiveDocument.Save(); note('已保存当前文档'); }
      else { note('没有活动文档'); }
    } else if (what === 'undo') {
      if (window.Application && Application.Undo) { Application.Undo(); note('已撤销一步'); }
      else { note('本机 WPS 不支持 Undo'); }
    } else if (what === 'panel') {
      poll(); note('已刷新');
    }
  } catch (e) {
    note('失败: ' + e.message);
  }
}

function note(msg) {
  document.getElementById('v-err').textContent = msg;
  setTimeout(function () {
    if (document.getElementById('v-err').textContent === msg) {
      document.getElementById('v-err').textContent = '';
    }
  }, 2500);
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
